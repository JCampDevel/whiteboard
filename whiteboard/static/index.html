<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Whiteboard</title>
<link rel="stylesheet" href="/style.css">
<script>
  // Apply a saved theme before the page paints, so it doesn't flash the wrong one.
  try {
    var t = localStorage.getItem("whiteboard-theme");
    if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
</head>
<body>
<header id="toolbar">
  <div class="group" role="radiogroup" aria-label="Tool">
    <button data-tool="select" class="tool active" title="Select, move, resize. Drag empty space to box-select. Shift/Ctrl+click adds (S)">Select</button>
    <button data-tool="pan" class="tool" title="Drag the canvas. Also: hold Space, or use the middle mouse button (H)">Pan</button>
    <button data-tool="controller" class="tool" title="Drag out a Controller rectangle (C)">Controller</button>
    <button data-tool="controlled_process" class="tool" title="Drag out a Controlled Process rectangle (P)">Controlled Process</button>
    <button data-tool="control_action" class="tool" title="Drag from one rectangle to another (A)">Control Action</button>
    <button data-tool="feedback" class="tool" title="Drag from one rectangle to another (F)">Feedback</button>
  </div>
  <div class="group">
    <div id="colour-group">
      <label for="colour-btn">Colour</label>
      <button id="colour-btn" aria-haspopup="true" aria-expanded="false" title="Colour chart: colours the selected items, or the next thing you draw"><span id="colour-swatch" class="swatch"></span></button>
      <div id="palette" role="menu" aria-label="Colour chart" hidden></div>
    </div>
    <label>Arrow line
      <select id="style">
        <option value="full">Full</option>
        <option value="dashed">Dashed</option>
      </select>
    </label>
  </div>
  <div class="group">
    <button id="save-file" title="Save the diagram to a file and folder you choose, and carry on working there (Ctrl+S)">Save as…</button>
    <button id="open-file-btn" title="Open a diagram file (Ctrl+O)">Open…</button>
    <button id="theme" title="Switch between following your system, light and dark">Theme: Auto</button>
    <button id="home" title="Return the view to your diagram">Home</button>
    <button id="reset-arrow" disabled title="Let the selected arrows choose their own sides and route again">Reset arrow</button>
    <button id="add-rel" disabled title="Select two or more arrows, then link them with a relationship and describe it">Add relationship</button>
    <button id="hide-arrow" disabled title="Hide the selected arrows from the diagram. They stay in the tables.">Hide arrow</button>
    <button id="unhide" disabled title="Draw every hidden arrow again">Unhide arrows (0)</button>
    <button id="delete" disabled title="Delete the selected item (Delete)">Delete</button>
  </div>
  <!-- Takes whatever room is left and shrinks, so a long message never pushes the toolbar onto two lines. -->
  <div id="status-area"><span id="file-name"></span><span id="status" role="status">Loading…</span></div>
</header>
<main id="scroller">
  <svg id="board" xmlns="http://www.w3.org/2000/svg"><defs id="defs"></defs><g id="world"><g id="edges"></g><g id="nodes"></g><g id="handles"></g><g id="overlay"></g></g></svg>
</main>
<section id="dock" aria-label="Entity tables">
  <div id="dock-grip" title="Drag to resize"></div>
  <div id="dock-bar">
    <button id="dock-toggle" aria-expanded="false" title="Show or hide the tables (T)">▲ Tables</button>
    <div id="tabs" role="tablist" hidden></div>
  </div>
  <div id="tables" hidden></div>
</section>
<dialog id="file-dialog" aria-labelledby="fd-title">
  <form id="fd-form">
    <h2 id="fd-title">Save as</h2>
    <div class="fd-where">
      <button type="button" id="fd-up" title="Go up one folder">↑ Up</button>
      <button type="button" id="fd-home" title="Go to your home folder">Home folder</button>
      <span id="fd-dir"></span>
    </div>
    <ul id="fd-list" aria-label="Folders and diagram files"></ul>
    <label class="fd-name">File name <input id="fd-name" type="text" autocomplete="off" spellcheck="false"></label>
    <p id="fd-error" role="alert"></p>
    <div class="fd-buttons">
      <button type="button" id="fd-cancel">Cancel</button>
      <button type="submit" id="fd-ok" class="primary">Save</button>
    </div>
  </form>
</dialog>
<dialog id="rel-dialog" aria-labelledby="rel-title">
  <form id="rel-form">
    <h2 id="rel-title">Add relationship</h2>
    <p id="rel-arrows"></p>
    <label class="rel-label" for="rel-text">Describe the relationship</label>
    <textarea id="rel-text" rows="4" maxlength="1000"></textarea>
    <div class="fd-buttons">
      <button type="button" id="rel-cancel">Cancel</button>
      <button type="submit" class="primary">Add</button>
    </div>
  </form>
</dialog>
<dialog id="ask-dialog" aria-labelledby="ask-text">
  <form method="dialog">
    <p id="ask-text"></p>
    <div class="fd-buttons">
      <button value="cancel">Cancel</button>
      <button value="ok" id="ask-ok" class="primary">OK</button>
    </div>
  </form>
</dialog>
<script src="/route.js"></script>
<script src="/app.js"></script>
</body>
</html>
